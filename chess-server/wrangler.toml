# Chess Online service for Cloudflare Workers. Not deployed by anything in this repository:
# deploying is done by you, with your account: `npx wrangler deploy` from this folder.
name = "chess-online-server"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Production: the package id(s) registered with Deska, comma separated. Leave empty until the panel is approved.
AUDIENCES = "chess-online"
# Development with a folder loaded in Deska: set both, and turn them off again for production.
# DEV_AUDIENCES is the loaded folder's key (dev- plus 12 hex characters). If you do not know it,
# try to sign in once and read the rejected audience in `npx wrangler tail`.
ALLOW_DEV_TOKENS = "false"
DEV_AUDIENCES = ""

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
